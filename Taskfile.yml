version: '3'

tasks:
  default:
    desc: "The default task"
    dir: q
    cmds:
      - go run . build
  oss-case-0:
    desc: "2 个 ECI 之间的内网通信"
    dir: q
    cmds:
      - go run . oss-case-0
  q:
    desc: "Run the q command help"
    dir: q
    cmds:
      - go run . --help
  proto:
    desc: "Generate the proto files"
    cmds:
      - docker compose exec -T q-dev /workspace/q/script/proto.sh